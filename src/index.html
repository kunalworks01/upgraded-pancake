<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a new repository</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="side-panel">
      <h1>Create a new repository</h1>
      <p class="subtitle">
        Repositories contain a project's files and version history. Have a project elsewhere?
        Import a repository.
      </p>
      <p>Required fields are marked with an asterisk (*).</p>

      <form>
        <div class="info-section">
          <h3>Repository details</h3>
          <label for="repository-name">Repository name *</label><br />
          <input id="repository-name" name="repository-name" type="text" required />
          <br /><br />
          <label for="description">Description</label><br />
          <input id="description" name="description" type="text" />
        </div>

        <div class="info-section">
          <h3>Visibility *</h3>
          <label><input type="radio" name="visibility" value="public" checked /> Public</label><br />
          <label><input type="radio" name="visibility" value="private" /> Private</label>
        </div>

        <div class="info-section">
          <h3>Start with a template</h3>
          <p>Templates pre-configure your repository with files.</p>
          <label for="template">Template</label><br />
          <select id="template" name="template">
            <option value="none">None</option>
            <option value="basic">Basic starter</option>
            <option value="node">Node project</option>
          </select>
        </div>

        <button type="submit">Create repository</button>
      </form>
    </div>
  </body>
</html>
